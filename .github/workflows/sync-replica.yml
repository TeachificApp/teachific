name: Sync Railway Replica

on:
  schedule:
    # Run every 5 minutes to keep Railway in sync
    - cron: '*/5 * * * *'
  
  workflow_dispatch:
    # Allow manual trigger

jobs:
  sync-database:
    runs-on: ubuntu-latest
    name: Sync Database to Railway
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Install dependencies
        run: npm install mysql2
      
      - name: Create replication config
        run: |
          cat > replication-config.json << 'EOF'
          {
            "manus": {
              "mysql": {
                "host": "gateway04.us-east-1.prod.aws.tidbcloud.com",
                "port": 4000,
                "username": "${{ secrets.MANUS_DB_USER }}",
                "password": "${{ secrets.MANUS_DB_PASS }}",
                "database": "${{ secrets.MANUS_DB_NAME }}",
                "ssl": true
              }
            },
            "railway": {
              "mysql": {
                "host": "${{ secrets.RAILWAY_DB_HOST }}",
                "port": ${{ secrets.RAILWAY_DB_PORT }},
                "username": "${{ secrets.RAILWAY_DB_USER }}",
                "password": "${{ secrets.RAILWAY_DB_PASS }}",
                "database": "${{ secrets.RAILWAY_DB_NAME }}"
              }
            }
          }
          EOF
      
      - name: Sync database
        run: node scripts/migrate-to-railway.mjs
        continue-on-error: true
      
      - name: Check sync status
        run: node scripts/failover-monitor.mjs check
        continue-on-error: true
      
      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '⚠️ Railway sync failed. Check workflow logs.'
            })

  sync-r2:
    runs-on: ubuntu-latest
    name: Sync Files to Cloudflare R2
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Install dependencies
        run: npm install @aws-sdk/client-s3
      
      - name: Create replication config
        run: |
          cat > replication-config.json << 'EOF'
          {
            "cloudflare": {
              "r2": {
                "accountId": "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}",
                "bucketName": "${{ secrets.CLOUDFLARE_R2_BUCKET }}",
                "accessKeyId": "${{ secrets.CLOUDFLARE_R2_ACCESS_KEY }}",
                "endpoint": "https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com"
              }
            }
          }
          EOF
      
      - name: Sync R2 bucket
        run: node scripts/sync-r2-bucket.mjs
        env:
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: ${{ secrets.MANUS_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MANUS_S3_SECRET_KEY }}
          CLOUDFLARE_R2_SECRET_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_KEY }}
        continue-on-error: true

  health-check:
    runs-on: ubuntu-latest
    name: Health Check
    needs: [sync-database, sync-r2]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Install dependencies
        run: npm install mysql2
      
      - name: Create replication config
        run: |
          cat > replication-config.json << 'EOF'
          {
            "manus": {
              "mysql": {
                "host": "gateway04.us-east-1.prod.aws.tidbcloud.com",
                "port": 4000,
                "username": "${{ secrets.MANUS_DB_USER }}",
                "password": "${{ secrets.MANUS_DB_PASS }}",
                "database": "${{ secrets.MANUS_DB_NAME }}",
                "ssl": true
              }
            },
            "railway": {
              "mysql": {
                "host": "${{ secrets.RAILWAY_DB_HOST }}",
                "port": ${{ secrets.RAILWAY_DB_PORT }},
                "username": "${{ secrets.RAILWAY_DB_USER }}",
                "password": "${{ secrets.RAILWAY_DB_PASS }}",
                "database": "${{ secrets.RAILWAY_DB_NAME }}"
              }
            }
          }
          EOF
      
      - name: Run health check
        run: node scripts/failover-monitor.mjs check
        continue-on-error: true
      
      - name: Alert if systems down
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            core.setFailed('Health check failed - systems may be down')
